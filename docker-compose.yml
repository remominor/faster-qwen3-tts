services:
  openai-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/remominor/faster-qwen3-tts:latest
    ports:
      - "8000:8000"
    volumes:
      - ./voices:/app/voices
      - ./hf_cache:/tmp/.cache/huggingface
    environment:
      - QWEN_TTS_MODEL=Qwen/Qwen3-TTS-12Hz-0.6B-Base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
